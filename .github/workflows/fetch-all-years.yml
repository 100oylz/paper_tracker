name: Fetch All Years Papers

on:
  workflow_dispatch:
    inputs:
      create_issue:
        description: 'Create GitHub issue for new papers'
        required: false
        default: false
        type: boolean

permissions: write-all

jobs:
  build:
    # 只允许在 main 上运行：本工作流会 git push --force origin main，
    # 防止在 vlam-tracker 等分支上手动触发时覆盖主线。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Shanghai"
      RUN_ENV: "prod"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run dblp watcher (all years)
        run: |
          cd src && python main.py run --env=${{ env.RUN_ENV }} --all_years

      - name: Update VLAM-Papers.md
        run: python scripts/convert_cache_to_md.py

      - name: Setup var
        id: vars
        run: |
          {
            echo "content_vlam<<EOF"
            echo "$MSG_VLAM"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup GIT user
        run: |
          git config --global user.name "100oylz"
          git config --global user.email "100oylz@users.noreply.github.com"

      - name: Push done work
        run: |
          git add -A -- . ':!.github/workflows'
          git diff --cached --quiet || git commit -m "Fetch all-years papers @ $(date '+%Y-%m-%d %H:%M')"
          git push --force origin main

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create vlam-line --repo ${{ github.repository }} --force || true

      - name: Create issue for VLAM line
        if: ${{ inputs.create_issue && env.MSG_VLAM != '' }}
        continue-on-error: true
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG_VLAM: ${{ steps.vars.outputs.content_vlam }}
          ISSUE_TITLE_TOPICS_VLAM: ${{ env.ISSUE_TITLE_TOPICS_VLAM }}
        with:
          filename: .github/issue-template-vlam.md
