name: Run DBLP Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]

permissions: write-all

jobs:
  build:
    # 只允许在 main 上运行：本工作流会 git push --force origin main，
    # 防止在 vlam-tracker 等分支上手动触发时覆盖主线。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Shanghai"
      RUN_ENV: "prod"
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODELS: ${{ secrets.LLM_MODELS }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run dblp watcher
        run: |
          cd src && python main.py run --env=${{ env.RUN_ENV }} ${{ github.event_name != 'workflow_dispatch' && '--primary_only' || '' }} ${{ github.event_name == 'workflow_dispatch' && '--skip_enrich' || '' }}

      - name: Extract related code links
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: python scripts/fetch_related_code.py
        continue-on-error: true

      - name: Fetch missing abstracts
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: python scripts/fetch_abstracts.py
        continue-on-error: true

      - name: Update VLAM-Papers.md
        run: python scripts/convert_cache_to_md.py

      - name: Setup var
        id: vars
        run: |
          {
            echo "content_vlam<<EOF"
            echo "$MSG_VLAM"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup GIT user
        run: |
          git config --global user.name "100oylz"
          git config --global user.email "100oylz@users.noreply.github.com"

      - name: Push done work
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "Fetch new papers @ $(date '+%Y-%m-%d %H:%M')"
          git push --force origin main

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create vlam-line --repo ${{ github.repository }} --force || true

      - name: Create issue for VLAM line
        if: ${{ env.MSG_VLAM != '' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG_VLAM: ${{ steps.vars.outputs.content_vlam }}
          ISSUE_TITLE_TOPICS_VLAM: ${{ env.ISSUE_TITLE_TOPICS_VLAM }}
        with:
          filename: .github/issue-template-vlam.md

      - name: Send email notification
        if: ${{ env.MAIL_TO != '' && env.MSG_VLAM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: VLAM Paper Update [${{ env.ISSUE_TITLE_TOPICS_VLAM }}]
          convert_markdown: true
          body: ${{ steps.vars.outputs.content_vlam }}
          to: ${{ secrets.MAIL_TO }}
          from: VLAM Paper Tracker
