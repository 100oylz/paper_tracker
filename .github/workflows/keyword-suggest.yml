name: Keyword Suggestion
# Registered on 2026-08-05 rebuild.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'

permissions:
  issues: write
  contents: read

jobs:
  suggest:
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Shanghai"
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODELS: ${{ secrets.LLM_MODELS }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run keyword suggestion
        run: python scripts/suggest_keywords.py

      - name: Setup var
        id: vars
        run: |
          {
            echo "content<<EOF"
            echo "$MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create keyword-suggestion --repo ${{ github.repository }} --force || true

      - name: Create an issue for keyword suggestion
        if: ${{ env.MSG != '' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ steps.vars.outputs.content }}
        with:
          filename: .github/keyword-suggestion-template.md

      - name: Send email notification
        if: ${{ env.MAIL_TO != '' && env.MSG != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: FL Tracker Keyword Suggestion
          convert_markdown: true
          body: ${{ env.MSG }}
          to: ${{ secrets.MAIL_TO }}
          from: FL Paper Tracker
