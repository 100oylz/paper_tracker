# ============================================================
# VLAM 论文追踪配置 — Vision-Language-Action Model（视觉-语言-动作模型）
# 单主线：VLAM（VLA / 具身智能 / 机器人操作与多模态大模型）
# 结构：dblp.shared 公共 venue 自动并入主线；runtime 统一控制运行参数
# ============================================================
dblp:
  url: https://dblp.org/search/publ/api?q={}&format=json&h=1000
  shared:
    venues:
      - "venue:AAAI:"
      - "venue:IJCAI:"
      - "venue:NeurIPS:"
      - "venue:ICML:"
      - "venue:ICLR:"
      - "venue:SIGIR:"
      - "venue:KDD:"
      - "venue:WSDM:"
  lines:
    - tag: "VLAM"
      name: "视觉-语言-动作模型与具身智能"
      enabled: true
      keywords:
        # 第一条为 primary keyword：每日增量扫描（watch.yml --primary_only）
        # 先用它全量扫所有 venue，命中新论文的 venue 才用其余关键词补扫。
        # 因此把最宽、最有代表性的词放第一位。
        - vision language action      # primary：VLA 模型主体
        - vision-language-action
        - vision language model       # 兜底 VLM
        - multimodal large            # multimodal large language model
        - embodied
        - robot learning
        - robot manipulation
        - robot control
        - robotic manipulation
        - visuomotor
        - affordance
        - robot navigation
        - mobile manipulation
        - instruction following
        - policy learning
      venues:
        # 计算机视觉 / 多模态
        - "venue:CVPR:"
        - "venue:ICCV:"
        - "venue:ECCV:"
        - "streamid:journals/ijcv:"
        - "streamid:journals/pami:"
        # NLP / 多模态大模型
        - "venue:ACL:"
        - "venue:EMNLP:"
        - "venue:NAACL-HLT:"
        - "venue:COLING:"
        - "streamid:journals/jmlr:"
        - "streamid:conf/mm:"
        # 机器人学（VLA 主要落地场景）
        - "streamid:conf/corl:"
        - "streamid:conf/rss:"
        - "streamid:conf/icra:"
        - "streamid:conf/iros:"
        - "streamid:journals/tro:"
        - "streamid:journals/ral:"
      subtopics:
        - vision-language-action
        - vision-language-model
        - multimodal-large-model
        - embodied-ai
        - robot-learning
        - robot-manipulation
        - robot-navigation
        - visuomotor-policy
        - instruction-following
        - sim2real-transfer
# 运行参数：所有字段均有默认值，缺省时使用下方默认值
runtime:
  year:
    min_offset: 5        # current_year - 5，不设绝对下限
    max_offset: 1        # current_year + 1
  request:
    retry: 10
    sleep_time: 6.0
    timeout: 15
  abstracts:
    enabled: true
    sleep_sec: 2.0
    max_retries: 4
  translate:
    enabled: true
    sleep_sec: 0.5
    max_retries: 3
  enrich:
    enabled: true
    batch_size: 5
    max_papers_per_run: 50

# LLM 分诊的通用标签；主线 subtopics 会在运行时合并进来
enrich:
  subtopics:
    - survey
    - other
