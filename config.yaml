# ============================================================
# 面向文档解析的数据隐私保护关键技术研究 — 论文追踪配置
# 双主线：DP（文档解析、隐私合规与端侧部署，整合原 SCHED + VLM）
#         FL（联邦学习与隐私保护）
# 结构：dblp.shared 公共 venue 自动并入每条主线；runtime 统一控制运行参数
# ============================================================
dblp:
  url: https://dblp.org/search/publ/api?q={}&format=json&h=1000
  shared:
    venues:
      - "venue:AAAI:"
      - "venue:IJCAI:"
      - "venue:NeurIPS:"
      - "venue:ICML:"
      - "venue:ICLR:"
      - "venue:SIGIR:"
      - "streamid:conf/sigmod:"
      - "venue:ICDE:"
      - "streamid:journals/pvldb:"
      - "venue:MLSys:"
      - "venue:KDD:"
      - "venue:WSDM:"
  lines:
    - tag: "DP"
      name: "文档解析、隐私合规与端侧部署"
      enabled: true
      keywords:
        - document pars
        - layout detect
        - table recogn
        - inference schedul
        - privacy preserv
        - model compress
        - model quantiz
        - knowledge distill
        - structured prun
        - vision language
      venues:
        # 原 SCHED 线
        - "venue:ICDAR:"
        - "venue:DAC:"
        - "streamid:conf/icse:"
        - "streamid:conf/eurosys:"
        - "venue:OSDI:"
        - "venue:SOSP:"
        - "venue:ISCA:"
        - "streamid:conf/sp:"
        - "venue:CCS:"
        - "streamid:conf/uss:"
        - "venue:NDSS:"
        - "streamid:journals/tpds:"
        - "streamid:journals/tc:"
        - "streamid:journals/tcad:"
        - "streamid:journals/tocs:"
        - "streamid:journals/tos:"
        - "streamid:journals/ai:"
        - "streamid:journals/ml:"
        # 原 VLM 线
        - "venue:CVPR:"
        - "venue:ICCV:"
        - "venue:ECCV:"
        - "streamid:journals/ijcv:"
        - "streamid:journals/pami:"
        - "venue:ACL:"
        - "venue:EMNLP:"
        - "venue:NAACL-HLT:"
        - "venue:COLING:"
        - "streamid:journals/jmlr:"
        - "streamid:conf/mm:"
      subtopics:
        - document-parsing
        - layout-detection
        - table-recognition
        - inference-scheduling
        - pipeline-grading
        - sensitivity-detection
        - privacy-compliance
        - resource-allocation
        - vision-language-model
        - model-quantization
        - knowledge-distillation
        - structured-pruning
        - edge-deployment
        - latency-optimization
    - tag: "FL"
      name: "联邦学习与隐私保护"
      enabled: true
      keywords:
        - federated learning
        - federated optimization
        - personalized federat
        - cross-device federat
        - cross-silo federat
        - horizontal federat
        - vertical federat
        - federated distillation
        - secure aggregation
        - communication efficient federat
        - heterogeneous federat
        - federated unlearning
        - federated continual learning
        - federated graph learning
        - federated domain adaptation
      venues:
        - "venue:AISTATS:"
        - "venue:UAI:"
        - "venue:WWW:"
        - "venue:CIKM:"
        - "streamid:conf/bigdataconf:"
        - "streamid:journals/tmlr:"
        - "streamid:journals/tifs:"
        - "streamid:journals/tkde:"
        - "streamid:journals/tdsc:"
      subtopics:
        - federated-learning
        - federated-optimization
        - personalized-federated-learning
        - cross-device-federated-learning
        - cross-silo-federated-learning
        - horizontal-federated-learning
        - vertical-federated-learning
        - secure-aggregation
        - federated-privacy
        - federated-unlearning
        - communication-efficiency
        - data-heterogeneity
        - federated-distillation
        - federated-graph-learning
# 运行参数：所有字段均有默认值，缺省时使用下方默认值
runtime:
  year:
    min_offset: 5        # current_year - 5，不设绝对下限
    max_offset: 1        # current_year + 1
  request:
    retry: 6
    sleep_time: 6.0
    timeout: 15
  abstracts:
    enabled: true
    sleep_sec: 2.0
    max_retries: 4
  translate:
    enabled: true
    sleep_sec: 0.5
    max_retries: 3
  enrich:
    enabled: true
    batch_size: 5
    max_papers_per_run: 50

# LLM 分诊的通用标签；各线 subtopics 会在运行时合并进来
enrich:
  subtopics:
    - survey
    - other
